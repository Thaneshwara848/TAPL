<section class="gallery-header">
  <div class="container">
    <h1>Experience</h1>
    <p>Explore selected organizations and training experience.</p>
  </div>
</section>

<section class="gallery-content">
  <div class="container">
    <!-- Category Filter -->
    <div class="gallery-filters">
      <button class="filter-btn active" (click)="selectedCategory = null">All</button>
      <button class="filter-btn" *ngFor="let category of categories" (click)="selectedCategory = category">
        {{ category }}
      </button>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid">
      <div class="gallery-item" *ngFor="let image of filteredImages">
        <img [src]="image.src" [alt]="image.alt" class="gallery-image" [class.gallery-logo]="image.category === 'Corporate Clients'" />
        <div class="gallery-overlay">
          <h3>{{ image.title }}</h3>
          <span class="category-tag">{{ image.category }}</span>
        </div>
      </div>
    </div>

  </div>
</section>
