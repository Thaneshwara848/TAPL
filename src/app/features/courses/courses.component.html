<section class="courses-header">
  <div class="container">
    <h1>Expertise &amp; Training</h1>
    <p>Explore technology topics covered through practical learning and training.</p>
  </div>
</section>

<section class="toc">
  <div class="container">
    <h2>Areas of Expertise</h2>
    <ul>
      <li *ngFor="let course of courses; let i = index">
        <a [href]="'#course-' + i">{{ course.title }}</a>
      </li>
    </ul>
  </div>
</section>

<section class="courses-content">
  <div class="container">
    <div class="courses-grid">
      <div class="course-card" *ngFor="let course of courses; let i = index" [id]="'course-' + i">
        <img [src]="course.image" [alt]="course.title" class="course-image" />
        <div class="course-info">
          <h3>{{ course.title }}</h3>
          <p class="course-description">{{ course.description }}</p>
          <div class="course-details">
            <a routerLink="/contact" class="enroll-btn">Discuss Training</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
